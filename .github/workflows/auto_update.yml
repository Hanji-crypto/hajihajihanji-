name: Daily Insider Data Update

on:
  schedule:
    # 04:17 UTC = 日本時間 13:17（米東部の夏時間 00:17 / 冬時間 23:17）
    # EDGARの受付は米東部22時まで。その後に走らせて当日分の提出を取りこぼさない。
    # 火〜土(UTC)=米国の月〜金の夜。毎時0分は混み合って遅延しやすいので17分にずらす。
    - cron: '17 4 * * 2-6'
  workflow_dispatch:      # 🚀 手動でいつでも即時実行できるボタンを設置
    inputs:
      mode:
        description: 'daily = 直近のみ / backfill = 過去6ヶ月をスキャン'
        type: choice
        options: [daily, backfill]
        default: daily
      lookback_days:
        description: 'daily時にさかのぼる日数（取りこぼし期間を埋めるとき増やす。例: 45）'
        type: string
        default: '5'

# insider.db をコミット＆プッシュするため書き込み権限が必要
permissions:
  contents: write

# 同時実行（手動実行と定期実行の重なり）による push 競合を防ぐ
concurrency:
  group: insider-db-update
  cancel-in-progress: false

jobs:
  update-db:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub上限(360分)の手前。スクリプト側の時間予算が先に働いて正常終了する
    env:
      PYTHONUNBUFFERED: '1'  # ログを即時表示（バッファリングで最後にまとめて出るのを防ぐ）
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Fetcher
        # ステップ単位のタイムアウト。ネットワーク待ちなどで時間予算の判定に戻れず固まっても、
        # ジョブ全体を強制終了せず後続のコミット手順まで進める（ジョブ全体の打ち切りだと全データが消える）。
        timeout-minutes: ${{ github.event.inputs.mode == 'backfill' && 330 || 150 }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "backfill" ]; then
            # 30日分≒約65分。6期間は6時間を超えるため、時間予算で打ち切り→再実行で続きから再開
            python a5_backfill_v3.py --max-minutes 300
          else
            python a5_backfill_v3.py --daily --lookback-days "${{ github.event.inputs.lookback_days || '5' }}" --max-minutes 120
          fi

      - name: Show DB Status
        if: ${{ !cancelled() }}   # 取得が失敗・時間切れでも、DBの到達点をRunのサマリに残す
        run: |
          python - <<'PY'
          import os, sqlite3
          c = sqlite3.connect("insider.db")
          latest, rows = c.execute("SELECT MAX(filing_date), COUNT(*) FROM insider_trades").fetchone()
          recent = c.execute(
              "SELECT filing_date, COUNT(DISTINCT filing_url), COUNT(*) FROM insider_trades "
              "GROUP BY filing_date ORDER BY filing_date DESC LIMIT 7").fetchall()
          lines = ["## DBの到達点", "", f"- 最新の提出日: **{latest}** / 総行数: {rows:,}", "",
                   "| 提出日 | 書類数 | 明細行 |", "|---|--:|--:|"]
          lines += [f"| {d} | {u:,} | {n:,} |" for d, u, n in recent]
          text = "\n".join(lines)
          print(text)
          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              open(path, "a", encoding="utf-8").write(text + "\n")
          PY

      - name: Commit and Push Changes
        if: ${{ !cancelled() }}   # 取得が失敗/途中終了でも、保存済みの分はコミットする
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add insider.db
          if git diff --staged --quiet; then
            echo "変更なし: コミットをスキップします"
            exit 0
          fi
          git commit -m "Auto-update insider.db [skip ci]"
          # 他のコミットが先に入っていても失敗しないよう、rebase してから push
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
