name: Daily Insider Digest (mail)

# 毎朝の日本語メール「昨夜のインサイダー大口買い Top5」を作り、配信する（digest.py）。
#
# いつ動くか:
#   - 22:07 UTC の火〜土 = 日本時間 水〜日の 07:07。
#     その時点の米国東部は前日 17〜18時なので「米国東部の前営業日」= 直近に取り込み済みの提出日になる
#     （auto_update.yml が 04:17 UTC に前営業日の分を取り込み、insider.db を main にコミットしている）。
#     日本時間の月曜 07:00 は米国東部の日曜＝前営業日が金曜で、土曜分と重なるので送らない（cron に入れない）。
#   - workflow_dispatch: 手動。既定は dry-run（送らない）。日付を指定して作り直せる。
#
# 送るか:
#   - secrets.BUTTONDOWN_API_KEY がある時だけ Buttondown で送る。無ければ dry-run（HTML・テキストを残すだけ）。
#   - 対象日のデータが無い日（休場日・取り込み失敗）は送らない。
#   - どちらでも、文面を実行サマリとアーティファクトに残す。
on:
  schedule:
    - cron: '7 22 * * 2-6'
  workflow_dispatch:
    inputs:
      date:
        description: '対象の提出日 YYYY-MM-DD（空なら米国東部の前営業日）'
        type: string
        default: ''
      send:
        description: '実際に送る（BUTTONDOWN_API_KEY がある時だけ）。既定は dry-run'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: insider-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
      # 値はリポジトリに書かない。Settings → Secrets and variables → Actions で設定する。
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      DIGEST_SENDER_NAME: ${{ vars.DIGEST_SENDER_NAME }}
      DIGEST_SENDER_CONTACT: ${{ vars.DIGEST_SENDER_CONTACT }}
      DIGEST_DASHBOARD_URL: ${{ vars.DIGEST_DASHBOARD_URL }}
      DIGEST_UNSUBSCRIBE_URL: ${{ vars.DIGEST_UNSUBSCRIBE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 自動更新が main にコミットした最新の insider.db を使う
          fetch-depth: 20   # 取得時点（insider.db の最終コミット時刻）を git log で読む

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build and send digest
        id: digest
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          # 手動実行は send にチェックした時だけ送る。定期実行はキーがあれば送る。
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.send != 'true' && '--dry-run' || '' }}
        run: |
          python digest.py --out digest_out ${INPUT_DATE:+--date "$INPUT_DATE"} $DRY_RUN

      - name: Upload digest
        if: ${{ always() && hashFiles('digest_out/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.digest.outputs.target_date || github.run_id }}
          path: digest_out/
          retention-days: 30
